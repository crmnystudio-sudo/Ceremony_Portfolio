<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works - Ceremony</title>
  <link rel="icon" href="Assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="Assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="Assets/favicon-180.png">
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    @font-face {
      font-family: 'Palatino Linotype';
      src: url('Assets/palatino-linotype/Palatino Linotype.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Palatino Linotype';
      src: url('Assets/palatino-linotype/palab.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #ffffff;
      --ink: #1a1a1a;
      --mid: #888;
      --gap: 6px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 3rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--cream);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .nav-gif {
      width: 6.75rem;
      height: 6.75rem;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .nav-logo {
      font-size: 2.25rem;
      font-weight: 400;
      font-style: normal;
      text-decoration: none;
      color: var(--ink);
      line-height: 1;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: baseline;
    }

    .nav-links a {
      font-size: 1.5rem;
      font-weight: 400;
      font-style: normal;
      text-decoration: none;
      color: var(--ink);
      line-height: 1;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover { opacity: 0.35; }

    .nav-burger {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      cursor: pointer;
      padding: 0.5rem;
      background: none;
      border: none;
    }

    .nav-burger span {
      width: 1.5rem;
      height: 2px;
      background: var(--ink);
      transition: 0.3s ease;
    }

    .nav-burger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .nav-burger.active span:nth-child(2) {
      opacity: 0;
    }

    .nav-burger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(8px, -8px);
    }

    /* WORK SECTION */
    #work {
      padding: 2.45rem var(--gap) 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--gap);
    }

    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #e8e5df;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .grid-item video,
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .grid-item:hover video,
    .grid-item:hover img {
      transform: scale(1.03);
    }

    .grid-item .tag {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f4f1ec;
      background: rgba(26, 26, 26, 0.55);
      padding: 0.2rem 0.5rem;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .grid-item:hover .tag { opacity: 1; }

    .grid-item .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.75rem 0.75rem 0.6rem;
      font-size: 0.72rem;
      color: #f4f1ec;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      line-height: 1.3;
    }

    .grid-item:hover .caption { opacity: 1; }

    /* CASE STUDY MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 200;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .modal.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem;
      animation: slideUp 0.3s ease;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-close {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: var(--ink);
      transition: opacity 0.2s ease;
      z-index: 201;
    }

    .modal-close:hover { opacity: 0.5; }

    .case-study {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
      width: 100%;
    }

    .case-study-media {
      width: 100%;
      min-height: 400px;
      aspect-ratio: var(--aspect-ratio, 16 / 9);
      background: #e8e5df;
      overflow: hidden;
      border-radius: 4px;
    }

    .case-study-media video,
    .case-study-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .carousel-container {
      position: relative;
      width: 100%;
    }

    .carousel-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding: 0 0.5rem;
      gap: 1rem;
    }

    .carousel-counter {
      font-size: 0.85rem;
      color: var(--mid);
      text-align: center;
      flex: 1;
    }

    .carousel-btn {
      background: none;
      border: 1px solid #d8d4ce;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--ink);
      transition: all 0.2s ease;
      border-radius: 2px;
    }

    .carousel-btn:hover {
      background: #f5f3f0;
      border-color: var(--ink);
    }

    .carousel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .grid-item {
      position: relative;
    }

    .grid-item .preview-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .grid-item:hover .preview-video {
      opacity: 1;
    }

    .case-study-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #d8d4ce;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      background: #e8e5df;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .gallery-item:hover {
      opacity: 0.8;
    }

    .gallery-item img,
    .gallery-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #888;
      text-align: center;
      padding: 0.5rem;
    }

    .case-study-info {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .case-study-header {
      border-bottom: 1px solid #d8d4ce;
      padding-bottom: 1.5rem;
    }

    .case-study-title {
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .case-study-meta {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 0.5rem;
    }

    .case-study-client {
      font-size: 1rem;
      color: var(--ink);
      font-weight: 400;
    }

    .case-study-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .case-study-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid);
      font-weight: 700;
    }

    .case-study-value {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--ink);
    }

    .case-study-description {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #444;
    }

    /* FOOTER */
    footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #d8d4ce;
      margin-top: 6rem;
      display: flex;
      justify-content: space-between;
    }

    .footer-mid {
      flex: 1;
      text-align: center;
    }

    footer span {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid);
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .nav-links a { font-size: 1.425rem; }
      .nav-logo { font-size: 2.1375rem; }
      .nav-links { gap: 1.5rem; }
      .case-study { grid-template-columns: 1fr; gap: 2.5rem; }
      .modal-content { padding: 4rem 2rem; }
    }

    @media (max-width: 640px) {
      nav { padding: 0.75rem 0.75rem 0.5rem; }

      .nav-burger { display: flex; }

      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: var(--cream);
        border-top: 1px solid #d8d4ce;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.2s ease-out;
        padding: 0;
        will-change: max-height;
      }

      .nav-links.active {
        max-height: 300px;
        padding: 0.5rem 0.75rem;
      }

      .nav-links a {
        font-size: 0.9rem;
        padding: 0.5rem 0;
        border-bottom: none;
      }

      .grid { grid-template-columns: repeat(2, 1fr); }
      .nav-logo { font-size: 1.2rem; }
      .nav-gif { width: 3.2rem; height: 3.2rem; }
      .modal-content { padding: 1rem 0.75rem; min-height: auto; }
      .case-study { gap: 1rem; }
      .case-study-title { font-size: 1.1rem; }
      .case-study-media { min-height: 200px; }
      .footer-mid { display: none; }
      .wave-divider { display: block; }
    }

    /* Mobile-only wave divider */
    .wave-divider {
      width: 100%;
      height: 22px;
      display: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    .wave-divider svg { width: 100%; height: 100%; display: block; }

    .wave-divider path {
      fill: none;
      stroke: #d8d4ce;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
  </style>
  <link rel="stylesheet" href="rainbow.css">
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.addEventListener('load', () => window.scrollTo(0, 0));
  </script>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-brand" href="home.html">
      <img class="nav-gif" src="Assets/CRMNY_GIF_5fps.gif" alt="" onerror="this.src='Assets/favicon-32.png'">
      <span class="nav-logo">ceremony.</span>
    </a>
    <button class="nav-burger" onclick="toggleMobileMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav-links">
      <li><a href="home.html?t=1" onclick="closeMobileMenu()">home</a></li>
      <li><a href="works.html?t=1" onclick="closeMobileMenu()">works</a></li>
      <li><a href="about.html?t=1" onclick="closeMobileMenu()">about</a></li>
      <li><a href="contact.html?t=1" onclick="closeMobileMenu()">contact</a></li>
    </ul>
  </nav>

  <div class="wave-divider"></div>

  <!-- WORK GRID -->
  <section id="work">
    <div class="grid" id="grid"></div>
  </section>

  <!-- CASE STUDY MODAL -->
  <div class="modal" id="caseStudyModal">
    <button class="modal-close" onclick="closeCaseStudy()">&times;</button>
    <div class="modal-content" id="caseStudyContent"></div>
  </div>

  <div class="wave-divider"></div>

  <!-- FOOTER -->
  <footer>
    <span>Ceremony</span>
    <span class="footer-mid">thanks for watching</span>
    <span>&copy; 2026</span>
  </footer>

  <script src="project-loader.js"></script>
  <script>
    async function initWorks() {
      await projectManager.init();
      const projects = projectManager.getAll();
      const grid = document.getElementById('grid');

      projects.forEach(project => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.style.cursor = 'pointer';

        // Always show thumbnail image
        const img = document.createElement('img');
        img.src = project.thumbnail_path;
        img.alt = project.title;
        img.onerror = () => { img.src = 'Assets/favicon-32.png'; };
        item.appendChild(img);

        // Add hover preview video if available
        const videos = projectManager.getVideoArray(project);
        if (videos.length > 0) {
          const previewVideo = document.createElement('video');
          previewVideo.className = 'preview-video';
          previewVideo.muted = true;
          previewVideo.loop = true;
          previewVideo.preload = 'metadata';
          previewVideo.crossOrigin = 'anonymous';
          const source = document.createElement('source');
          source.src = videos[0];
          source.type = 'video/mp4';
          previewVideo.appendChild(source);
          item.appendChild(previewVideo);

          item.addEventListener('mouseenter', () => {
            previewVideo.currentTime = 0;
            previewVideo.play().catch(() => {});
          });
          item.addEventListener('mouseleave', () => {
            previewVideo.pause();
            previewVideo.currentTime = 0;
          });
        }

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = project.client;
        item.appendChild(tag);

        const caption = document.createElement('span');
        caption.className = 'caption';
        caption.textContent = project.title;
        item.appendChild(caption);

        item.addEventListener('click', () => showCaseStudy(project));
        grid.appendChild(item);
      });
    }

    let currentVideoIndex = 0;
    let currentVideos = [];

    function showCaseStudy(project) {
      const modal = document.getElementById('caseStudyModal');
      const content = document.getElementById('caseStudyContent');

      currentVideos = projectManager.getVideoArray(project);
      currentVideoIndex = 0;
      const isVideo = projectManager.isVideo(project);

      // Default aspect ratio
      let aspectRatio = project.aspect_ratio || '16 / 9';

      let mediaHtml = '';
      if (isVideo && currentVideos.length > 0) {
        mediaHtml = `<video id="caseStudyVideo" controls preload="metadata" style="width: 100%; height: 100%;"><source src="${currentVideos[0]}" type="video/mp4">Your browser does not support the video tag.</video>`;
      } else if (project.video_link) {
        mediaHtml = `<img src="${project.video_link}" style="width: 100%; height: auto;" onerror="this.src='Assets/favicon-32.png'">`;
      }

      // Carousel controls if multiple videos
      let carouselHtml = '';
      if (currentVideos.length > 1) {
        carouselHtml = `
          <div class="carousel-controls">
            <button class="carousel-btn" id="prevBtn" onclick="previousVideo()">← Previous</button>
            <div class="carousel-counter"><span id="videoCounter">1</span> / <span id="videoTotal">${currentVideos.length}</span></div>
            <button class="carousel-btn" id="nextBtn" onclick="nextVideo()">Next →</button>
          </div>
        `;
      }

      // Gallery section removed for now
      let galleryHtml = '';

      content.innerHTML = `
        <div class="case-study">
          <div>
            <div class="case-study-media" id="caseStudyMedia" style="--aspect-ratio: ${aspectRatio};">${mediaHtml}</div>
            ${carouselHtml}
          </div>
          <div class="case-study-info">
            <div class="case-study-header">
              <h1 class="case-study-title">${project.title}</h1>
              <div class="case-study-meta">Client</div>
              <div class="case-study-client">${project.client}</div>
            </div>

            <div class="case-study-field">
              <div class="case-study-label">Agency</div>
              <div class="case-study-value">${project.agency}</div>
            </div>

            <div class="case-study-field">
              <div class="case-study-label">Year</div>
              <div class="case-study-value">${project.year}</div>
            </div>

            <div class="case-study-field">
              <div class="case-study-label">Team Members</div>
              <div class="case-study-value">${project.team_members}</div>
            </div>

            <div class="case-study-field">
              <div class="case-study-label">Skills & Expertise</div>
              <div class="case-study-value">${project.skills}</div>
            </div>

            <div class="case-study-field">
              <div class="case-study-label">About this project</div>
              <div class="case-study-description">${project.description}</div>
            </div>
          </div>
        </div>
      `;

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';

      // Detect video dimensions and set aspect ratio
      if (isVideo && currentVideos.length > 0) {
        const video = document.getElementById('caseStudyVideo');
        const media = document.getElementById('caseStudyMedia');

        const setAspectRatio = () => {
          setTimeout(() => {
            if (video && video.videoWidth && video.videoHeight) {
              media.style.setProperty('--aspect-ratio', `${video.videoWidth} / ${video.videoHeight}`);
            }
          }, 100);
        };

        video.addEventListener('loadedmetadata', setAspectRatio);
        if (video.readyState >= 1) {
          setAspectRatio();
        }
      }

      updateCarouselButtons();
    }

    function previousVideo() {
      if (currentVideoIndex > 0) {
        currentVideoIndex--;
        updateVideo();
      }
    }

    function nextVideo() {
      if (currentVideoIndex < currentVideos.length - 1) {
        currentVideoIndex++;
        updateVideo();
      }
    }

    function updateVideo() {
      const video = document.getElementById('caseStudyVideo');
      const media = document.getElementById('caseStudyMedia');
      if (video && currentVideos[currentVideoIndex]) {
        const newSrc = currentVideos[currentVideoIndex];
        video.querySelector('source').src = newSrc;
        video.load();
        video.play().catch(() => {});

        const setAspectRatio = () => {
          if (video.videoWidth && video.videoHeight) {
            media.style.setProperty('--aspect-ratio', `${video.videoWidth} / ${video.videoHeight}`);
          }
        };

        video.addEventListener('loadedmetadata', setAspectRatio, { once: true });

        document.getElementById('videoCounter').textContent = currentVideoIndex + 1;
        updateCarouselButtons();
      }
    }

    function updateCarouselButtons() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (prevBtn) prevBtn.disabled = currentVideoIndex === 0;
      if (nextBtn) nextBtn.disabled = currentVideoIndex === currentVideos.length - 1;
    }

    function closeCaseStudy() {
      const modal = document.getElementById('caseStudyModal');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // Close modal when clicking outside
    document.getElementById('caseStudyModal').addEventListener('click', (e) => {
      if (e.target.id === 'caseStudyModal') closeCaseStudy();
    });

    // Keyboard escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCaseStudy();
    });

    initWorks();
  </script>

  <script src="cursor.js"></script>
  <script src="dividers.js"></script>
  <script>
    function toggleMobileMenu() {
      const burger = document.querySelector('.nav-burger');
      const links = document.querySelector('.nav-links');
      burger.classList.toggle('active');
      links.classList.toggle('active');
    }

    function closeMobileMenu() {
      const burger = document.querySelector('.nav-burger');
      const links = document.querySelector('.nav-links');
      burger.classList.remove('active');
      links.classList.remove('active');
    }

    document.addEventListener('click', (e) => {
      const nav = document.querySelector('nav');
      if (!nav.contains(e.target)) {
        closeMobileMenu();
      }
    });
  </script>

</body>
</html>

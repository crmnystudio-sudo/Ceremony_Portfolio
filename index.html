<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceremony - Portfolio</title>
  <link rel="icon" href="Assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="Assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="Assets/favicon-180.png">
  <style>
    @font-face {
      font-family: 'Palatino Linotype';
      src: url('Assets/palatino-linotype/Palatino Linotype.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #ffffff;
      font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      max-width: 400px;
      width: 100%;
    }

    .page-icon {
      width: 200px;
      height: auto;
      display: block;
    }

    .welcome-text {
      font-size: 2rem;
      font-weight: 400;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .password-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .password-input {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid #ddd;
      font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      background: #ffffff;
      color: #1a1a1a;
      transition: border-color 0.2s ease;
      text-align: center;
    }

    .password-input:focus {
      outline: none;
      border-color: #1a1a1a;
    }

    .password-button {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      background: #1a1a1a;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    .password-button:hover {
      opacity: 0.7;
    }

    .error-message {
      color: #c41e3a;
      font-size: 0.85rem;
      text-align: center;
      display: none;
      margin-top: -0.5rem;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 640px) {
      .login-container { gap: 2rem; }
      .page-icon { width: 150px; }
      .welcome-text { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img class="page-icon" src="Assets/CRMNY_GIF_5fps.gif" alt="Ceremony" onerror="this.src='Assets/favicon-32.png'">
    <h1 class="welcome-text">welcome</h1>
    <form class="password-form" onsubmit="handleLogin(event)">
      <input
        type="password"
        id="passwordInput"
        class="password-input"
        placeholder="password"
        autocomplete="off"
      >
      <button type="button" class="password-button" onclick="handleLogin()">enter</button>
      <div id="errorMessage" class="error-message"></div>
    </form>
  </div>
  <script>
    const correctPassword = 'ceremony';

    // Check if already authenticated
    function checkAuth() {
      if (sessionStorage.getItem('portfolio_auth') === 'true') {
        window.location.href = 'home.html';
      }
    }

    function handleLogin() {
      const password = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('errorMessage');

      if (password === correctPassword) {
        sessionStorage.setItem('portfolio_auth', 'true');
        window.location.href = 'home.html';
      } else {
        errorMsg.textContent = 'Incorrect password';
        errorMsg.classList.add('show');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      checkAuth();

      const passwordInput = document.getElementById('passwordInput');
      const submitBtn = document.querySelector('.password-button');

      // Focus on input
      if (passwordInput) passwordInput.focus();

      // Button click
      if (submitBtn) {
        submitBtn.addEventListener('click', function(e) {
          e.preventDefault();
          handleLogin();
        });
      }

      // Enter key
      if (passwordInput) {
        passwordInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin();
          }
        });
      }
    });
  </script>

</body>
</html>

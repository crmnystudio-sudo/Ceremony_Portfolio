name: Deploy with LFS Files

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS files are smudged
        run: |
          echo "Checking video files..."
          file Assets/videos/P0012\ Dfa\ Brickbybrick\ 2.0.0F\ Hd.mp4
          head -c 100 Assets/videos/P0012\ Dfa\ Brickbybrick\ 2.0.0F\ Hd.mp4

      - name: Deploy to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
